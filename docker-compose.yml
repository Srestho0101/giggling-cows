services:

  backend:
    build:
      context: ./backend
    container_name: cowfarm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: cowfarm-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
